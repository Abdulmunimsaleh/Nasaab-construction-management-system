<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f59e0b'><path d='M2 22h20V19H2v3zm2-5h16V6l-8-4-8 4v11zm8-12.7 6 3V15H6V8.3l6-3z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NASAAB CONSTRUCTION LIMITED - Construction Site Management & Reporting Platform</title>
    <meta name="description" content="Manage projects, daily site reports, labour attendance, materials inventory, equipment usage, safety issues, site photos, costs, and automated PDF reports." />
    <meta name="theme-color" content="#0f172a" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        console.error('Captured client startup error:', event);
        var r = document.getElementById('root');
        if (r && (!r.innerHTML || r.innerHTML.trim() === '')) {
          r.innerHTML = '<div style="padding:28px;font-family:system-ui,sans-serif;background:#0f172a;color:#f8fafc;min-height:100vh;">' +
            '<div style="max-width:560px;margin:40px auto;background:#1e293b;padding:24px;border-radius:16px;border:1px solid #334155;">' +
            '<h2 style="color:#f59e0b;font-size:18px;margin-top:0;">NASAAB Construction — Startup Diagnostics</h2>' +
            '<p style="color:#fca5a5;font-size:13px;font-family:monospace;background:#450a0a;padding:12px;border-radius:8px;word-break:break-word;">' + (event.message || 'Script execution error') + '</p>' +
            '<p style="color:#94a3b8;font-size:12px;margin-top:12px;">Source: ' + (event.filename || 'bundle') + ' (Line ' + (event.lineno || 0) + ')</p>' +
            '<button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;background:#f59e0b;border:none;border-radius:8px;font-weight:bold;cursor:pointer;color:#0f172a;">Reload</button>' +
            '</div></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
